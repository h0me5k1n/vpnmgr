name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck and BusyBox
        run: sudo apt-get install -y shellcheck busybox

      - name: Run smoke tests
        run: bash scripts/smoke-test.sh

      - name: Check WebUI JavaScript and contracts
        run: |
          node --check vpnmgr_www.js
          node --check scripts/webui-browser-test.js
          node scripts/webui-contract-test.js

      - name: Run OpenVPN and WebUI contracts under BusyBox ash
        run: |
          shellcheck --shell=sh --severity=warning scripts/openvpn-runtime-test.sh scripts/openvpn-presets-test.sh scripts/webui-backend-test.sh scripts/api-profile-test.sh scripts/source-download-test.sh
          busybox ash -n vpnmgr.sh
          busybox ash scripts/openvpn-runtime-test.sh
          busybox ash scripts/openvpn-presets-test.sh
          busybox ash scripts/webui-backend-test.sh
          busybox ash scripts/api-profile-test.sh
          busybox ash scripts/source-download-test.sh

  version-bump:
    name: Version bump check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require SCRIPT_VERSION bump when router-delivered files change
        run: |
          base_sha="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base_sha" HEAD | grep -E '^(vpnmgr\.sh|vpnmgr_www\.(asp|js)|www/.+|providers/provider_.+\.sh)$' || true)

          if [ -z "$changed" ]; then
            echo "No router-delivered files changed — version check skipped."
            exit 0
          fi

          echo "Changed router-delivered files:"
          echo "$changed"

          base_ver=$(git show "${base_sha}:vpnmgr.sh" | grep -m1 'SCRIPT_VERSION=' | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')
          head_ver=$(grep -m1 'SCRIPT_VERSION=' vpnmgr.sh | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+')

          echo "Base version : $base_ver"
          echo "Branch version: $head_ver"

          if [ "$base_ver" = "$head_ver" ]; then
            echo "ERROR: router-delivered files changed but SCRIPT_VERSION was not bumped in vpnmgr.sh"
            exit 1
          fi

          echo "OK: $base_ver -> $head_ver"
